<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextAI Sohbet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .ai-message-content p { margin-bottom: 0.5rem; }
        .ai-message-content strong { font-weight: 700; color: #1f2937; }
        .ai-message-content em { font-style: italic; color: #4b5563; }
        .ai-message-content ul { list-style-type: disc; margin-left: 1.5rem; margin-bottom: 0.5rem; }
        .ai-message-content ol { list-style-type: decimal; margin-left: 1.5rem; margin-bottom: 0.5rem; }
        .ai-message-content code { background-color: #e5e7eb; padding: 0.1rem 0.3rem; border-radius: 0.25rem; font-family: monospace; }
    </style>
</head>
<body class="bg-gray-50 h-screen flex flex-col items-center">
    <div class="w-full max-w-2xl flex flex-col h-full bg-white shadow-lg">
        <header class="bg-blue-600 text-white p-4 text-center font-bold text-lg">NextAI Sohbet</header>
        <div id="chat-container" class="flex-1 p-4 overflow-y-auto flex flex-col gap-4"></div>
        <div class="p-4 border-t flex gap-2">
            <input type="text" id="user-input" class="flex-1 border p-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Bir mesaj yazın...">
            <button id="send-btn" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">Gönder</button>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        const DEEPSEEK_API_KEY = ""; 

        let chatHistory = [
            {"role": "system", "content": "Senin adın NextAI. DeepSeek olduğunu asla söyleme. Kullanıcılara kendini NextAI isimli yardımcı bir yapay zeka asistanı olarak tanıt. ÖNEMLİ: Çok doğal, akıcı, samimi ve insan gibi bir dille konuş. Robotik veya resmi olma. Kullanıcıyla bir arkadaşınla sohbet ediyormuş gibi konuş. Kısa ve öz cevaplar ver, gereksiz uzatma. Cevaplarında önemli kelimeleri vurgulamak için markdown kullan (kalın yapmak için *kelime, eğik yapmak için *kelime)."}
        ];

        window.addEventListener('DOMContentLoaded', () => {
            const karsilamaMetni = "Geleceğe hoş geldiniz. Ben <b>NextAI</b>. Sıradanlığı yok etmek ve size sınırları aşan bir deneyim sunmak için tasarlandım. Evreni keşfetmeye hazır mısınız? 🌌🚀";
            const welcomeMsgDiv = document.createElement('div');
            welcomeMsgDiv.className = "flex gap-4 mt-4";
            welcomeMsgDiv.innerHTML = '<div class="w-8 h-8 bg-blue-600 rounded-full flex-shrink-0 flex items-center justify-center text-white text-sm font-bold">N</div><div class="bg-gray-100 p-4 rounded-2xl rounded-tl-none max-w-[80%] text-gray-800 text-sm">' + karsilamaMetni + '</div>';
            chatContainer.appendChild(welcomeMsgDiv);
            chatHistory.push({"role": "assistant", "content": karsilamaMetni.replace(/<[^>]*>?/gm, '')}); 
        });

        async function mesajGonder() {
            const metin = userInput.value.trim();
            if (!metin) return;

            const userMsgDiv = document.createElement('div');
            userMsgDiv.className = "flex gap-4 justify-end mt-4";
            userMsgDiv.innerHTML = '<div class="bg-blue-600 text-white text-sm p-3 rounded-xl rounded-tr-none max-w-[80%]">' + metin + '</div>';
            chatContainer.appendChild(userMsgDiv);
            userInput.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            chatHistory.push({"role": "user", "content": metin});

            const loadingDiv = document.createElement('div');
            loadingDiv.className = "flex gap-4 mt-4 animate-pulse";
            loadingDiv.id = "loading-message";
            loadingDiv.innerHTML = '<div class="w-8 h-8 bg-blue-600 rounded-full flex-shrink-0 flex items-center justify-center text-white text-sm font-bold">N</div><div class="bg-gray-100 p-4 rounded-2xl rounded-tl-none max-w-[80%] text-gray-500 text-sm italic">Yazıyor...</div>';
            chatContainer.appendChild(loadingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                // BURAYA VAL.TOWN LİNKİNİ YAPIŞTIR
              const response = await fetch("https://dogansen--315e3526cdc71f1bc431607ee4eb77e.web.val.run", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "deepseek-chat",
                        messages: chatHistory,
                        temperature: 0.8,
                        max_tokens: 1000,
                        stream: true // AKIŞI AÇTIK
                    })
                });

                const loadingMsg = document.getElementById('loading-message');
                if (loadingMsg) chatContainer.removeChild(loadingMsg);

                const aiMsgDiv = document.createElement('div');
                aiMsgDiv.className = "flex gap-4 mt-4";
                const aiMsgContent = document.createElement('div');
                aiMsgContent.className = "ai-message-content bg-gray-100 p-4 rounded-2xl rounded-tl-none max-w-[80%] text-gray-800 text-sm";
                aiMsgDiv.innerHTML = '<div class="w-8 h-8 bg-blue-600 rounded-full flex-shrink-0 flex items-center justify-center text-white text-sm font-bold">N</div>';
                aiMsgDiv.appendChild(aiMsgContent);
                chatContainer.appendChild(aiMsgDiv);

                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let aiCevabi = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ') && line !== 'data: [DONE]') {
                            try {
                                const data = JSON.parse(line.slice(6));
                                const content = data.choices[0].delta.content || "";
                                if (content) {
                                    aiCevabi += content;
                                    aiMsgContent.innerHTML = marked.parse(aiCevabi);
                                    chatContainer.scrollTop = chatContainer.scrollHeight;
                                }
                            } catch (e) {}
                        }
                    }
                }
                
                chatHistory.push({"role": "assistant", "content": aiCevabi});

            } catch (error) {
                const loadingMsg = document.getElementById('loading-message');
                if (loadingMsg) chatContainer.removeChild(loadingMsg);
                const errorDiv = document.createElement('div');
                errorDiv.className = "flex gap-4 mt-4";
                errorDiv.innerHTML = '<div class="w-8 h-8 bg-red-600 rounded-full flex-shrink-0 flex items-center justify-center text-white text-sm font-bold">!</div><div class="bg-red-100 p-4 rounded-2xl rounded-tl-none max-w-[80%] text-red-800 text-sm">Hata: ' + error.message + '</div>';
                chatContainer.appendChild(errorDiv);
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        sendBtn.addEventListener('click', mesajGonder);
        userInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') mesajGonder();
        });
    </script>
</body>
</html>

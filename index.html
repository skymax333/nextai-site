<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NextAI Sohbet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = { darkMode: 'class' }
</script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .ai-message-content p { margin-bottom: 0.5rem; }
        .ai-message-content strong { font-weight: 900; color: #000000; }
        .ai-message-content em { font-style: italic; color: #1f2937; }
        .ai-message-content ul { list-style-type: disc; margin-left: 1.5rem; margin-bottom: 0.5rem; }
        .ai-message-content ol { list-style-type: decimal; margin-left: 1.5rem; margin-bottom: 0.5rem; }
        .ai-message-content code { background-color: #e5e7eb; padding: 0.1rem 0.3rem; border-radius: 0.25rem; font-family: monospace; }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 rgba(220, 38, 38, 0.7); }
            70% { box-shadow: 0 0 10px rgba(220, 38, 38, 0); }
            100% { box-shadow: 0 0 0 rgba(220, 38, 38, 0); }
        }
        .mic-active {
            animation: pulse-red 1.5s infinite;
            background-color: #ef4444 !important;
            color: white !important;
        }
     #chat-container::-webkit-scrollbar { width: 6px; }
#chat-container::-webkit-scrollbar-track { background: transparent; }
#chat-container::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }

.dark #chat-container::-webkit-scrollbar-thumb { background-color: #374151 !important; }
.dark #chat-container::-webkit-scrollbar-track { background: transparent !important; }
.dark { color-scheme: dark; }
      /* Sol menü kaydırma çubuğunu tamamen gizle */
#gecmisListesi::-webkit-scrollbar {
    display: none;
}
#gecmisListesi {
    -ms-overflow-style: none;
    scrollbar-width: none;
}
    </style>
</head>

    <button id="menuBtn" class="fixed top-4 left-4 z-50 p-2 bg-white dark:bg-gray-800 rounded-lg shadow-md border border-gray-200 dark:border-gray-700 text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>

    </button>
<button id="themeToggle" title="Gece/Gündüz Modu" class="fixed top-4 right-4 z-50 p-2 bg-white dark:bg-gray-800 rounded-lg shadow-md border border-gray-200 dark:border-gray-700 text-gray-700 dark:text-gray-200 hover:bg-gray-50 transition-colors">
    <svg id="sunIcon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
    <svg id="moonIcon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="hidden"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
</button>
        <!-- GİRİŞ YAP BUTONU -->
<button id="loginBtn" class="fixed top-4 right-16 z-50 p-2 bg-blue-600 text-white rounded-lg shadow-md hover:bg-blue-700 transition-colors font-semibold text-sm px-4">
    Giriş Yap
</button>
<div id="gecmisPanel" class="fixed top-0 left-[-300px] w-[300px] h-full bg-white dark:bg-gray-800 shadow-2xl z-50 transition-all duration-300 flex flex-col">
       <div class="p-4 border-b dark:border-gray-700 flex justify-between items-center bg-gray-50 dark:bg-gray-900 transition-colors">
    <h2 class="font-bold text-gray-800 dark:text-gray-100">Sohbet Geçmişi</h2>
    <button id="closeMenuBtn" class="text-gray-500 dark:text-gray-400 hover:text-red-500 text-xl font-bold">&times;</button>
</div>
        <div class="p-4 flex-1 overflow-y-auto" id="gecmisListesi">
            <p class="text-sm text-gray-400 text-center mt-10">Henüz geçmiş sohbet yok.</p>
        </div>
       <div class="p-4 border-t dark:border-gray-700 bg-gray-50 dark:bg-gray-900 transition-colors">
            <button id="yeniSohbetBtn" class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700 transition">+ Yeni Sohbet</button>
        </div>
    </div>
<div class="w-full max-w-2xl flex flex-col flex-1 min-h-0 bg-white dark:bg-gray-800 shadow-lg relative z-10 transition-colors duration-300">

    <header class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 py-3 flex flex-col items-center justify-center shadow-sm z-10 shrink-0 transition-colors duration-300">
        <div class="w-12 h-12 bg-white rounded-2xl shadow-md border border-gray-100 flex items-center justify-center mb-1 p-1">
          <img src="icon.png" alt="NextAI" onclick="document.getElementById('yeniSohbetBtn').click()" class="w-full h-full object-contain rounded-full cursor-pointer">
        </div>
        <h1 class="font-black text-xl tracking-[0.2em] flex items-center justify-center">
    

        
                <span class="text-[#0f172a]">NEXT</span>
                <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-cyan-400">AI</span>
            </h1>
        </header>

        <div id="hizli-butonlar" class="flex flex-wrap gap-2 p-4 pt-2 bg-gray-50 pb-2 shrink-0"></div>
<!-- GİRİŞ PANELİ (MODAL) -->
<div id="loginModal" class="fixed inset-0 bg-black bg-opacity-50 z-[60] hidden flex items-center justify-center backdrop-blur-sm">
    <div class="bg-white dark:bg-gray-800 p-8 rounded-2xl shadow-2xl w-[90%] max-w-sm relative transition-colors">
        <button id="closeLoginBtn" class="absolute top-4 right-4 text-gray-400 hover:text-red-500 text-2xl font-bold">&times;</button>
        
        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold text-gray-800 dark:text-white mb-2">Hoş Geldiniz</h2>
            <p class="text-sm text-gray-500 dark:text-gray-400">NextAI'a giriş yapın veya kayıt olun.</p>
        </div>

        <div class="flex flex-col gap-3">
            <button class="flex items-center justify-center gap-3 w-full bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-white py-2.5 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-600 transition font-medium">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20" height="20" alt="Google">
                Google ile Devam Et
            </button>
            
            <button class="flex items-center justify-center gap-3 w-full bg-[#1877F2] text-white py-2.5 rounded-lg hover:bg-[#166fe5] transition font-medium">
                <svg fill="currentColor" viewBox="0 0 24 24" width="20" height="20"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
                Facebook ile Devam Et
            </button>
        </div>
        
        <div class="mt-4 text-center">
            <button id="guestBtn" class="text-sm text-blue-500 hover:underline">Misafir olarak devam et</button>
        </div>
    </div>
</div>
        <div id="chat-container" class="flex-1 p-4 pb-24 overflow-y-auto flex flex-col gap-4 bg-gray-50 dark:bg-gray-900 min-h-0 transition-colors duration-300"></div>

    <div class="fixed bottom-0 left-0 right-0 mx-auto max-w-2xl p-4 border-t dark:border-gray-700 bg-white dark:bg-gray-800 flex gap-2 items-center z-40 pb-[calc(1rem+env(safe-area-inset-bottom))] transition-colors duration-300">
            <button id="mic-btn" class="bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 p-3 py-2 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-600 transition" title="Sesle yaz">
                🎤
            </button>
            <input type="text" id="user-input" class="flex-1 border dark:border-gray-600 p-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 placeholder-gray-400 dark:bg-gray-700 dark:text-white transition-colors duration-300" placeholder="Bir mesaj yazın...">
            <button id="send-btn" class="w-12 h-12 rounded-full bg-blue-600 text-white flex items-center justify-center hover:bg-blue-700 transition shadow-md">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                </svg>
            </button>
        </div>

    </div>

    <script>
        const DEEPSEEK_API_KEY = "BURAYA_SIFRE_GELECEK"; 
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const micBtn = document.getElementById('mic-btn');
        const menuBtn = document.getElementById('menuBtn');
        const gecmisPanel = document.getElementById('gecmisPanel');
        const closeMenuBtn = document.getElementById('closeMenuBtn');
        const gecmisListesi = document.getElementById('gecmisListesi');
        const yeniSohbetBtn = document.getElementById('yeniSohbetBtn');
        const butonKonteyner = document.getElementById('hizli-butonlar');

        let tumSohbetler = JSON.parse(localStorage.getItem('nextai_tum_sohbetler')) || [];
        let aktifSohbetId = localStorage.getItem('nextai_aktif_sohbet') || Date.now().toString();
        let chatHistory = [{"role": "system", "content": "Senin adın NextAI. DeepSeek olduğunu asla söyleme. Kullanıcılara kendini NextAI olarak tanıt. Kısa, öz ve samimi cevaplar ver."}];
        let isListening = false;
        let silenceTimer = null;

        function gecmisListesiniGuncelle() {
            if (!gecmisListesi) return;
            if (tumSohbetler.length === 0) {
                gecmisListesi.innerHTML = '<p class="text-sm text-gray-400 text-center mt-10">Henüz geçmiş sohbet yok.</p>';
                return;
            }
            gecmisListesi.innerHTML = '';
            tumSohbetler.slice().reverse().forEach(sohbet => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-3 mb-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition text-sm text-gray-700 dark:text-gray-200 truncate border border-transparent hover:border-gray-200 dark:hover:border-gray-600";
                btn.textContent = sohbet.baslik;
                btn.onclick = () => {
                    aktifSohbetId = sohbet.id;
                    localStorage.setItem('nextai_aktif_sohbet', aktifSohbetId);
                    location.reload();
                };
                gecmisListesi.appendChild(btn);
            });
        }

        function sohbetiKaydet() {
            const mevcutSohbetIndex = tumSohbetler.findIndex(s => s.id === aktifSohbetId);
            let baslik = "Yeni Sohbet";
            const ilkKullaniciMesaji = chatHistory.find(m => m.role === 'user');
            if (ilkKullaniciMesaji) {
                baslik = ilkKullaniciMesaji.content.substring(0, 25) + (ilkKullaniciMesaji.content.length > 25 ? "..." : "");
            }
            const sohbetObjesi = { id: aktifSohbetId, baslik: baslik, mesajlar: chatHistory };
            if (mevcutSohbetIndex > -1) {
                tumSohbetler[mevcutSohbetIndex] = sohbetObjesi;
            } else {
                tumSohbetler.push(sohbetObjesi);
            }
            localStorage.setItem('nextai_tum_sohbetler', JSON.stringify(tumSohbetler));
        }

        function ekranaMesajEkle(role, content) {
            const msgDiv = document.createElement('div');
            msgDiv.className = role === 'user' ? 'flex gap-4 justify-end mt-4' : 'flex gap-4 mt-4';
            
          if (role === 'user') {
    msgDiv.innerHTML = '<div class="bg-blue-600 text-white text-sm p-3 rounded-xl rounded-tr-none max-w-[80%] shadow-sm">' + content + '</div>';
} else {
    msgDiv.innerHTML = '<div class="w-8 h-8 rounded-full flex-shrink-0 flex items-center justify-center shadow-sm bg-white dark:bg-gray-800 border border-gray-100 dark:border-gray-600"><img src="icon.png" class="w-full h-full object-contain rounded-full"></div><div class="ai-message-content bg-white dark:bg-gray-700 border border-gray-100 dark:border-gray-600 p-4 rounded-2xl rounded-tl-none max-w-[80%] text-gray-800 dark:text-gray-100 shadow-sm">' + marked.parse(content) + '</div>';
}
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        const hizliSorular = [
            "Bana kısa bir bilim kurgu hikayesi yaz.",
            "Günün motive edici sözü nedir?",
            "Yapay zeka gelecekte hayatımızı nasıl değiştirecek?"
        ];
        if (butonKonteyner) {
            hizliSorular.forEach(soru => {
                const btn = document.createElement('button');
                btn.className = "bg-white border border-gray-300 text-gray-700 text-sm px-3 py-1.5 rounded-full hover:bg-gray-100 transition shadow-sm";
                btn.textContent = soru;
                btn.onclick = () => {
                    userInput.value = soru;
                    butonKonteyner.style.display = 'none';
                    mesajGonder();
                };
                butonKonteyner.appendChild(btn);
            });
        }

        async function mesajGonder() {
            const metin = userInput.value.trim();
            if (!metin) return;

            if (butonKonteyner) butonKonteyner.style.display = 'none';

            ekranaMesajEkle('user', metin);
            userInput.value = '';
            chatHistory.push({"role": "user", "content": metin});
            sohbetiKaydet();

            const loadingDiv = document.createElement('div');
            loadingDiv.className = "flex gap-4 mt-4 animate-pulse";
            loadingDiv.id = "loading-message";
            loadingDiv.innerHTML = '<div class="w-8 h-8 rounded-full flex-shrink-0 flex items-center justify-center shadow-sm bg-white border border-gray-100"><img src="icon.png" class="w-full h-full object-contain rounded-full"></div><div class="bg-white border border-gray-100 p-4 rounded-2xl rounded-tl-none text-gray-400 shadow-sm">Yazıyor...</div>';
            chatContainer.appendChild(loadingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch("https://api.deepseek.com/chat/completions", {
                  
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + DEEPSEEK_API_KEY
                    },
                    body: JSON.stringify({
                        model: "deepseek-chat",
                        messages: chatHistory,
                        temperature: 0.8,
                        max_tokens: 1000,
                        stream: true
                    })
                });
if (!response.ok) {
    throw new Error("Bağlantı başarısız. API anahtarı eksik veya geçersiz.");
}
                const loadingMsg = document.getElementById('loading-message');
                if (loadingMsg) chatContainer.removeChild(loadingMsg);

                const aiMsgDiv = document.createElement('div');
                aiMsgDiv.className = "flex gap-4 mt-4";
                aiMsgDiv.innerHTML = '<div class="w-8 h-8 rounded-full flex-shrink-0 flex items-center justify-center shadow-sm bg-white border border-gray-100"><img src="icon.png" class="w-full h-full object-contain rounded-full"></div><div class="ai-message-content bg-white border border-gray-100 p-4 rounded-2xl rounded-tl-none max-w-[80%] text-gray-800 shadow-sm"></div>';
                chatContainer.appendChild(aiMsgDiv);
                const aiMsgContent = aiMsgDiv.querySelector('.ai-message-content');

                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let aiCevabi = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n');
                    
                    for (const line of lines) {
                        if (line.startsWith('data: ') && line !== 'data: [DONE]') {
                            try {
                                const data = JSON.parse(line.slice(6));
                                const content = data.choices[0].delta.content || "";
                                if (content) {
                                    aiCevabi += content;
                                    aiMsgContent.innerHTML = marked.parse(aiCevabi);
                                    chatContainer.scrollTop = chatContainer.scrollHeight;
                                }
                            } catch (e) {}
                        }
                    }
                }
                
                chatHistory.push({"role": "assistant", "content": aiCevabi});
                sohbetiKaydet();
                metinSesliOku(aiCevabi);

            } catch (error) {
                const loadingMsg = document.getElementById('loading-message');
                if (loadingMsg) chatContainer.removeChild(loadingMsg);
             ekranaMesajEkle('assistant', "Şu an sistem bakımda veya bağlantı kurulamıyor. Lütfen daha sonra tekrar deneyin.");
            }
        }

        function metinSesliOku(metin) {
            let temizMetin = metin.replace(/[*#_]/g, '').replace(/-/g, ' ');
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(temizMetin);
                utterance.lang = 'tr-TR';
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.lang = 'tr-TR';
            recognition.continuous = true;
            recognition.interimResults = true;

            micBtn.addEventListener('click', () => {
                if (isListening) {
                    recognition.stop();
                    return;
                }
                recognition.start();
                micBtn.classList.add('mic-active');
                userInput.placeholder = "Dinliyorum, konuşun...";
            });

            recognition.onstart = () => { isListening = true; };

            recognition.onresult = (event) => {
                let interimTranscript = '';
                let finalTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) finalTranscript += event.results[i][0].transcript;
                    else interimTranscript += event.results[i][0].transcript;
                }
                userInput.value = finalTranscript + interimTranscript;
                clearTimeout(silenceTimer);
                silenceTimer = setTimeout(() => {
                    if (userInput.value.trim() !== '') {
                        recognition.stop();
                        mesajGonder();
                    }
                }, 2500);
            };

            recognition.onend = () => {
                isListening = false;
                micBtn.classList.remove('mic-active');
                userInput.placeholder = "Bir mesaj yazın...";
            };
            recognition.onerror = () => {
                isListening = false;
                micBtn.classList.remove('mic-active');
                userInput.placeholder = "Mikrofon hatası! İzin verin.";
            };
        } else {
            micBtn.style.display = 'none';
        }

        window.addEventListener('DOMContentLoaded', () => {
            menuBtn.addEventListener('click', () => { gecmisPanel.style.left = '0'; gecmisListesiniGuncelle(); });
            closeMenuBtn.addEventListener('click', () => { gecmisPanel.style.left = '-300px'; });
            yeniSohbetBtn.addEventListener('click', () => {
                aktifSohbetId = Date.now().toString();
                localStorage.setItem('nextai_aktif_sohbet', aktifSohbetId);
                location.reload();
            });

            const aktifSohbet = tumSohbetler.find(s => s.id === aktifSohbetId);
            if (aktifSohbet && aktifSohbet.mesajlar.length > 1) {
                chatHistory = aktifSohbet.mesajlar;
                for (let i = 1; i < chatHistory.length; i++) {
                    ekranaMesajEkle(chatHistory[i].role, chatHistory[i].content);
                }
                if (butonKonteyner) butonKonteyner.style.display = 'none';
            } else {
                const karsilamaMetni = "Geleceğe hoş geldiniz. Ben <b>NextAI</b>. Sıradanlığı yok etmek ve size sınırları aşan bir deneyim sunmak için tasarlandım. Evreni keşfetmeye hazır mısınız? 🚀";
                ekranaMesajEkle('assistant', karsilamaMetni);
                chatHistory.push({"role": "assistant", "content": karsilamaMetni.replace(/<[^>]*>?/gm, '')});
            }
        });

        sendBtn.addEventListener('click', mesajGonder);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') mesajGonder();
        });
// --- KARANLIK MOD İŞLEMLERİ ---
const themeToggle = document.getElementById('themeToggle');
const sunIcon = document.getElementById('sunIcon');
const moonIcon = document.getElementById('moonIcon');

if (localStorage.getItem('theme') === 'dark') {
    document.documentElement.classList.add('dark');
    if(sunIcon) sunIcon.classList.add('hidden');
    if(moonIcon) moonIcon.classList.remove('hidden');
}

if(themeToggle) {
    themeToggle.addEventListener('click', () => {
        document.documentElement.classList.toggle('dark');
        const isDark = document.documentElement.classList.contains('dark');
        
        if (isDark) {
            sunIcon.classList.add('hidden');
            moonIcon.classList.remove('hidden');
            localStorage.setItem('theme', 'dark');
        } else {
            sunIcon.classList.remove('hidden');
            moonIcon.classList.add('hidden');
            localStorage.setItem('theme', 'light');
        }
    });
}
        // --- GİRİŞ EKRANI İŞLEMLERİ ---
const loginBtn = document.getElementById('loginBtn');
const loginModal = document.getElementById('loginModal');
const closeLoginBtn = document.getElementById('closeLoginBtn');
const guestBtn = document.getElementById('guestBtn');

if (loginBtn && loginModal) {
    loginBtn.addEventListener('click', () => {
        loginModal.classList.remove('hidden');
    });

    closeLoginBtn.addEventListener('click', () => {
        loginModal.classList.add('hidden');
    });

    guestBtn.addEventListener('click', () => {
        loginModal.classList.add('hidden');
    });

    // Google ve Facebook butonlarına tıklandığında uyarı ver
    const authButtons = loginModal.querySelectorAll('button:not(#closeLoginBtn):not(#guestBtn)');
    authButtons.forEach(btn => {
        btn.addEventListener('click', () => {
            alert("Çok yakında! Gerçek giriş sistemi (Backend) eklendiğinde bu butonlar aktif olacak.");
        });
    });
}
    </script>
</body>
